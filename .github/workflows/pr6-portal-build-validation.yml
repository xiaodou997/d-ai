name: PR6 Portal build validation

on:
  push:
    branches:
      - fix/ci-portal-checksum-shell

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build standalone Portal artifact
        run: bun run build:portal-static

      - name: Smoke test standalone Portal artifact
        run: bash scripts/smoke_portal.sh release/portal
