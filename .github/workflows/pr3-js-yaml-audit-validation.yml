name: PR3 js-yaml audit validation

on:
  push:
    branches:
      - fix/ci-js-yaml-audit

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Frozen install
        run: bun install --frozen-lockfile

      - name: High severity audit
        run: bun audit --audit-level=high

      - name: Lockfile remains stable
        run: git diff --exit-code package.json bun.lock
