name: PR4 Go build validation

on:
  push:
    branches:
      - fix/ci-go-lint-baseline

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DAI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/dai_test?sslmode=disable
      DAI_TEST_REDIS_ADDR: 127.0.0.1:6379
      DAI_TEST_DATABASE_STRICT: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Dependency direction
        run: go run ./cmd/checkdeps

      - name: Test
        run: go test ./...

      - name: Billing invariant lifecycle suite
        run: go test ./internal/billing/invariants -count=1 -v
