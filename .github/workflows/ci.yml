name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DAI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/dai_test?sslmode=disable
      DAI_TEST_REDIS_ADDR: 127.0.0.1:6379
      # Billing correctness is only proven when these tests actually run. Without
      # this the suite degrades to skips the moment the database is unreachable,
      # and a green run stops meaning anything.
      DAI_TEST_DATABASE_STRICT: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version-file: .golangci-lint-version
          args: --timeout=5m

      - name: Validate golangci-lint scope
        run: bash scripts/check_golangci_config.sh

      - name: Go vulnerability scan
        env:
          GOBIN: ${{ runner.temp }}/go-bin
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "${GOBIN}/govulncheck" ./...

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Module dependency direction
        run: go run ./cmd/checkdeps

      - name: Test
        run: go test ./...

      - name: Transport coverage gate
        run: bash scripts/check_transport_coverage.sh

      - name: Assert database tests were not skipped
        run: |
          go test ./internal/billing/... ./internal/ai/adapters/postgres/... -v 2>&1 | tee /tmp/db-tests.log
          if grep -q '^--- SKIP' /tmp/db-tests.log; then
            echo "::error::database-backed tests were skipped; billing was not verified"
            grep -B2 '^--- SKIP' /tmp/db-tests.log
            exit 1
          fi

      - name: Group route policy atomic integration
        run: |
          go test ./internal/ai/adapters/postgres \
            -run '^TestCommercialRepo(ReplaceGroupTargetsIsAtomicAndVersioned|UpdateGroupRoutePolicyIsVersioned)$' \
            -count=1 -v 2>&1 | tee /tmp/group-route-policy-tests.log
          if grep -q '^--- SKIP' /tmp/group-route-policy-tests.log; then
            echo "::error::group route policy integration test was skipped"
            exit 1
          fi

      - name: Billing invariant lifecycle suite
        run: go test ./internal/billing/invariants -count=1 -v

      - name: OpenAPI contract is current
        run: |
          go run ./cmd/openapi
          git diff --exit-code contracts/openapi.yaml

      - name: Authorization matrix is current
        run: |
          go run ./cmd/checkauthz
          git diff --exit-code docs/AUTHORIZATION_MATRIX.md

      - name: Schema migration chain is current
        run: |
          go run ./cmd/checkschema
          git diff --exit-code docs/SCHEMA_CHAIN.md

      - name: Schema release helper is valid
        run: |
          bash -n deploy/production/schema_release.sh
          deploy/production/schema_release.sh --help >/dev/null
          if deploy/production/schema_release.sh migrate >/tmp/schema-release-gate.log 2>&1; then
            echo "::error::schema release helper migrated without explicit confirmation"
            exit 1
          fi
          grep -q 'SCHEMA_RELEASE_CONFIRM=APPLY' /tmp/schema-release-gate.log

      - name: Database role provisioning helper is valid
        run: |
          bash -n deploy/production/provision_db_roles.sh
          deploy/production/provision_db_roles.sh --help >/dev/null
          if DB_ROLE_PROVISION_DATABASE_URL=postgres://invalid.example/dai deploy/production/provision_db_roles.sh apply >/tmp/db-role-provision-gate.log 2>&1; then
            echo "::error::database role provisioning ran without explicit confirmation"
            exit 1
          fi
          grep -q 'DB_ROLE_PROVISION_CONFIRM=APPLY' /tmp/db-role-provision-gate.log

      - name: Database ownership cutover helper is valid
        run: |
          bash -n deploy/production/cutover_db_ownership.sh
          deploy/production/cutover_db_ownership.sh --help >/dev/null
          if DB_OWNERSHIP_CUTOVER_ADMIN_DATABASE_URL=postgres://invalid.example/dai \
             DB_OWNERSHIP_CUTOVER_RUNTIME_DATABASE_URL=postgres://invalid.example/dai \
             DB_OWNERSHIP_CUTOVER_BILLING_DATABASE_URL=postgres://invalid.example/dai \
             deploy/production/cutover_db_ownership.sh apply >/tmp/db-ownership-cutover-gate.log 2>&1; then
            echo "::error::database ownership cutover ran without explicit confirmation"
            exit 1
          fi
          grep -q 'DB_OWNERSHIP_CUTOVER_CONFIRM=APPLY' /tmp/db-ownership-cutover-gate.log

      - name: Replay full schema migration chain
        env:
          SCHEMA_REPLAY_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/dai_test?sslmode=disable
        run: bash scripts/replay_schema_chain.sh

      - name: Database ownership probe
        env:
          SCHEMA_OWNERSHIP_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/dai_test?sslmode=disable
        run: bash scripts/check_db_ownership.sh

  frontend:
    name: Portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generated API types are current
        run: bun run ensure:api

      - name: Reject breaking OpenAPI operations
        if: github.event_name == 'pull_request'
        env:
          OPENAPI_BASELINE_REF: ${{ github.event.pull_request.base.sha }}
        run: node apps/portal/scripts/check-openapi-contract.mjs

      - name: Typecheck
        run: bun run typecheck

      - name: Frontend quality contracts
        run: |
          bun run validate:frontend-quality
          bun run validate:portal-styles
          bun run validate:portal-architecture

      - name: Frontend dependency vulnerability scan
        run: bun audit --audit-level=high

      - name: Test
        run: bun run test

      - name: Build standalone Portal artifact
        run: bun run build:portal-static

      - name: Smoke test standalone Portal artifact
        run: bash scripts/smoke_portal.sh release/portal

      - name: Build embed Portal artifact
        run: |
          bun run build:frontend
          go build -o /tmp/dai-embed-smoke ./cmd/server

      - name: Smoke test embed Portal artifact
        run: bash scripts/smoke_embed_portal.sh /tmp/dai-embed-smoke

  release:
    name: Release evidence and container contract
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build release artifacts
        run: make build-linux-amd64

      - name: Generate release SBOM, provenance and checksums
        run: bash scripts/generate_release_metadata.sh release

      - name: Verify release artifact contracts
        run: |
          bash scripts/smoke_portal.sh release/portal
          bash scripts/smoke_embed_portal.sh release/dai-linux-amd64
          bash scripts/smoke_release.sh --help >/dev/null
          test -s release/SBOM.spdx.json
          test -s release/PROVENANCE.json
          test -s release/SHA256SUMS

      - name: Verify hardened production image definition
        run: |
          grep -q '^USER 10001:10001$' deploy/production/Dockerfile
          grep -q '^    read_only: true$' deploy/production/compose.yaml
          grep -q '^      - ALL$' deploy/production/compose.yaml

      - name: Build production image
        run: docker build --tag dai:ci --file deploy/production/Dockerfile .

      - name: Scan production image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dai:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
