name: PR2 batch refund removal validation

on:
  push:
    branches:
      - fix/remove-batch-usage-refund

jobs:
  closure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DAI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/dai_test?sslmode=disable
      DAI_TEST_REDIS_ADDR: 127.0.0.1:6379
      DAI_TEST_DATABASE_STRICT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1

      - name: Assert batch refund surface is gone
        shell: bash
        run: |
          if git grep -n -E 'BatchRefundUsage|BatchOp(Result|Error)|admin-batch-refund-usage|/api/v1/ai/usage/batch-refund|batchRefundUsage|BatchRefundUsageInputBody|BatchUsageOpOutputBody|AdminUsageBillingModuleDeps|adminUsageBillingModule|registerAdminUsageBilling|newAdminUsageBillingHandlers'; then
            echo "::error::batch usage refund surface still has tracked references"
            exit 1
          fi

      - name: Verify settlement reversal behavior
        run: |
          go test ./internal/billing/service \
            -run '^Test(DeductionCommandsHonorCanceledContext|RefundUsageCreditsAccountsOnceAndAuditsUsage)$' \
            -count=1 -v

      - name: Compile affected transport and server packages
        run: |
          go test ./internal/transport ./cmd/server -run '^$' -count=1
          go build ./cmd/server

      - name: Regenerate OpenAPI from transport
        run: |
          go run ./cmd/openapi
          git diff --exit-code contracts/openapi.yaml

      - name: Install Portal dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated Portal contract
        run: |
          bun run ensure:api
          git diff --exit-code apps/portal/src/api/generated

      - name: Portal typecheck
        run: bun run typecheck

      - name: Targeted Portal billing facade test
        run: bunx vitest run apps/portal/src/api/platformAdminBilling.test.ts
