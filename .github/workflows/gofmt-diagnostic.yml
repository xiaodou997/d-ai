name: Gofmt Diagnostic

on:
  push:
    branches: [main]

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Show gofmt drift
        run: |
          gofmt -w .
          git diff -- internal/ai/console/console_runtime_auth.go internal/ai/core/identity/types.go internal/ai/gateway/runtime_owner.go internal/ai/gateway/tasks_subject_test.go
          test -n "$(git diff --name-only)"
