# uni-ai-api 配置示例（复制为 config.yaml 后修改）
# 所有字段通过环境变量注入，本文件仅作参考
#
# 必填环境变量：
#   DATABASE_URL        postgres DSN
#   URM_BASE_URL        URM 服务地址
#   URM_CLIENT_ID       本服务在 URM 的 client_id
#   URM_DISPLAY_NAME    本服务在 URM 的显示名称
#   PROVIDER_KEY_MASTER provider API key 加密主密钥（32字节以上随机字符串）
#
# 可选环境变量：
#   SERVER_ADDR         监听地址，默认 :13010
#   PORT                监听端口（SERVER_ADDR 的简写形式）
#   REDIS_ADDR          Redis 地址，留空则禁用，默认空
#   REDIS_PASSWORD      Redis 密码，默认空
#   DB_MAX_CONNS        连接池最大连接数，默认 20
#   DB_MIN_CONNS        连接池最小连接数，默认 2
#   DB_MAX_CONN_LIFETIME 连接最大生命周期，默认 1h
#   URM_DESCRIPTION     本服务描述信息
#   URM_TIMEOUT         URM 请求超时，默认 10s
#   LOG_LEVEL           日志级别：debug / info / warn / error，默认 info
#   APP_ENV             development → console 日志格式，其他 → JSON 格式

server:
  port: 13010

postgres:
  dsn: 'postgres://postgres:postgres@127.0.0.1:5432/uni_ai_api?sslmode=disable&search_path=public'
  max_conns: 10
  min_conns: 1

redis:
  addr: '127.0.0.1:6379' # 留空则禁用

urm:
  base_url: 'http://127.0.0.1:6900'
  client_id: 'uni-ai-api-local'
  display_name: 'Uni AI API Gateway'
  description: 'AI API gateway service for SSO authentication'

security:
  provider_key_master: 'change-me-local-provider-key-master'
