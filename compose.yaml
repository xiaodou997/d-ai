services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - dai-postgres-data:/var/lib/postgresql/data
      - ./internal/db/init.sql:/docker-entrypoint-initdb.d/001-dai-init.sql:ro
      - ./internal/db/dev_seed.sql:/docker-entrypoint-initdb.d/002-dai-dev-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dai"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    volumes:
      - dai-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  dai-postgres-data:
  dai-redis-data:
