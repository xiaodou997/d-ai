# D-AI 本地启动配置（不入仓：.gitignore 已忽略 config.yaml）。
# 生产用环境变量（DAI_*）注入，本文件仅本地 make dev 使用。
# 优先级：环境变量 > 本文件 > 代码默认值。

app:
  env: development

server:
  addr: ':19641'
  port: 19641
  read_timeout: 30
  write_timeout: 0
  idle_timeout: 60

database:
  url: postgres://postgres:postgres@localhost:15432/dai?sslmode=disable

redis:
  addr: 127.0.0.1:16379

jwt:
  expiration: 2h
  refresh_expiration: 168h
  issuer: dai

security:
  # 微信支付等敏感配置的加密主密钥
  secret_master_key: ''
  # Provider API key 加密主密钥（≥32 字节随机串）
  provider_key_master: '0c52fb81af673f1fae576eef73d36364'

sso:
  cookie_domain: ''
  cookie_secure: false
  issuer_url: http://localhost:19641
  customer_portal_base_url: http://localhost:19641
  allowed_redirect_uris:
    - http://localhost:19641

legal:
  base_url: http://localhost:19641/legal
  terms_version: '2026-07-19'
  privacy_version: '2026-07-19'

log:
  level: debug

scheduler:
  pre_auth_timeout_minutes: 30

billing:
  requested_tenant_micro: 300000
  requested_user_micro: 300000
  lease_ttl: 5m
  lease_grace: 15m
  window_max_age: 3m
  renew_lead: 90s
  admission_headroom: 30s
  worker_interval: 5s
  dispatch_lease: 30s
  pick_limit: 32

delegation:
  allowed_clients: []
  audience: []
  scope: ai.invoke
  ttl: 3m
