# D-AI 本地启动配置（不入仓：.gitignore 已忽略 config.yaml）。
# 生产用环境变量（DAI_*）注入，本文件仅本地 make dev 使用。
# 优先级：环境变量 > 本文件 > 代码默认值。

app:
  env: development

server:
  addr: ':19641'
  # metrics / readiness management listener；默认仅绑定回环地址，不暴露到公网
  management_addr: '127.0.0.1:19642'
  read_timeout: 30
  idle_timeout: 60
  max_body_bytes: 67108864
  max_header_bytes: 32768
  # 生产必须配置可信的浏览器/链接公共 origin；不要从 Host 头推导公网 URL。
  public_base_url: ''
  # 仅列出实际反向代理的来源网段；空值表示不信任任何 forwarded 头。
  trusted_proxy_cidrs: []

database:
  url: postgres://postgres:postgres@localhost:15432/dai?sslmode=disable
  # Optional outside production; production must use a separate billing role.
  billing_url: ""

redis:
  addr: 127.0.0.1:16379

jwt:
  expiration: 15m
  refresh_expiration: 168h
  issuer: dai

auth:
  activation_expiration: 24h

security:
  # URM、JWT 和 AI 敏感配置的统一加密主密钥；生产环境必须使用高熵随机值
  secret_master_key: ''
  # 当前密钥版本；轮换时先改 ID 和主密钥，再把旧值放入 previous
  secret_master_key_id: v1
  # 旧密钥列表，格式：keyID=key；仅保留仍在宽限期内的旧密钥
  secret_master_key_previous: []

storage:
  data_dir: data

runtime:
  # 单账户（租户 / 终端用户）在途计费请求上限。结算是后付费的，准入只能拦下一个
  # 请求，所以最坏透支 ≈ 这个值 × 单请求最高成本 —— 它的作用是让这个乘积有限。
  # ai_runtime_limit_policies 里显式配置的 scope 用配置值，不叠加此默认值。
  # 设为 0 关闭默认上限，透支随之重新变得无界。
  default_in_flight_per_account: 32

legal:
  terms_version: '2026-07-19'
  privacy_version: '2026-07-19'

log:
  level: debug

# OpenTelemetry uses the standard OTEL_TRACES_* environment variables when
# enabled. Default sampler is parentbased_traceidratio with a 10% ratio.
# OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4318
# OTEL_EXPORTER_OTLP_INSECURE=true
# OTEL_TRACES_SAMPLER=parentbased_traceidratio
# OTEL_TRACES_SAMPLER_ARG=0.1
