name: dai

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 128mb
    mem_limit: 768m
    environment:
      POSTGRES_DB: dai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../internal/db/init.sql:/docker-entrypoint-initdb.d/001-dai-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dai"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 192m
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  app:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile
    image: dai:${DAI_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: 1536m
    env_file:
      - .env
    environment:
      DAI_APP_ENV: production
      DAI_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/dai?sslmode=disable
      DAI_REDIS_ADDR: redis:6379
      DAI_DATA_DIR: /data
    ports:
      - "127.0.0.1:80:19641"
    volumes:
      - ../data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:19641/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

volumes:
  postgres-data:
  redis-data:
