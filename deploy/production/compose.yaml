name: dai

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile
    image: dai:${DAI_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    mem_limit: 1536m
    env_file:
      - .env
    environment:
      DAI_APP_ENV: production
      DAI_DATABASE_URL: postgres://dai:${DAI_DATABASE_PASSWORD:?set DAI_DATABASE_PASSWORD}@postgres:5432/dai?sslmode=disable
      DAI_BILLING_DATABASE_URL: postgres://dai_billing:${DAI_BILLING_DATABASE_PASSWORD:?set DAI_BILLING_DATABASE_PASSWORD}@postgres:5432/dai?sslmode=disable
      DAI_REDIS_ADDR: redis:6379
      DAI_REDIS_DB: "1"
      DAI_DATA_DIR: /data
    ports:
      - "127.0.0.1:14600:19641"
    volumes:
      - ../data:/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:19642/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

networks:
  dev-network:
    external: true
    name: dev-network
