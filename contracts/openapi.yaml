  /v1/tasks:
    get:
      operationId: ai-list-tasks
      parameters:
        - in: query
          name: status
          schema:
            enum:
              - pending
              - running
              - completed
              - failed
              - cancelled
            type: string
        - in: query
          name: type
          schema:
            enum:
              - images.generation
              - images.edit
              - chat.completions
            type: string
        - in: query
          name: limit
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
        - in: query
          name: starting_after
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskListResponse"
          description: 任务列表。
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeAPIErrorResponse"
          description: 过滤条件或游标不合法
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeAPIErrorResponse"
          description: API key 无效、禁用或过期
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeAPIErrorResponse"
          description: 任务服务暂不可用
      security:
        - taskBearerAuth: []
      summary: 列出异步任务
      tags:
        - runtime
        - tasks
    post:
      description: 使用 API key 创建图片生成、图片编辑或聊天完成任务。type 为必填字段；chat.completions 强制 stream=false，只保存最终响应。相同凭据复用 Idempotency-Key 且执行输入相同时返回原任务，不同输入返回 409。metadata 不参与幂等指纹并原样回显。可选 webhook_url 仅接受公网 HTTPS。任务进入终态时发送最小通知，body 只含 source=D-AI、event 和 task_id；完整状态、结果及错误必须通过 GET /v1/tasks/{id} 获取。
      operationId: ai-create-task
      parameters:
        - description: 可选幂等键；作用域按当前 API key 隔离。
          in: header
          name: Idempotency-Key
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AsyncTaskCreateJSONRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AsyncTaskCreateMultipartRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskCreateResponse"
          description: 任务已持久化并进入 pending 状态。
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeAPIErrorResponse"
          description: 信封、任务类型或执行输入不合法
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeAPIErrorResponse"
          description: API key 无效、禁用或过期
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeAPIErrorResponse"
          description: 额度、余额或订阅准入失败
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeAPIErrorResponse"
          description: 模型、分组或服务访问未授权
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeAPIErrorResponse"
          description: Idempotency-Key 已用于不同执行输入
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeAPIErrorResponse"
          description: 租户任务达到并发上限
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeAPIErrorResponse"
          description: 任务服务暂不可用
      security:
        - taskBearerAuth: []
      summary: 创建异步任务
      tags:
        - runtime
        - tasks
