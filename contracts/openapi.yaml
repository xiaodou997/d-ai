  securitySchemes:
    taskBearerAuth:
      bearerFormat: API key
      description: "使用 Authorization: Bearer sk-ai-xxx 调用异步任务 API。"
      scheme: bearer
      type: http
info:
  title: D-AI
  version: dev
openapi: 3.1.0
paths:
  /.well-known/jwks.json:
    get:
      operationId: get-jwks-well-known
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKSResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
          description: Error
      summary: JWKS 公钥集
      tags:
        - auth
  /api/auth/login:
    post:
      operationId: auth-login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
          description: Error
      summary: 账号密码登录
      tags:
        - auth
  /api/auth/logout:
    post:
      operationId: auth-logout
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
          description: Error
      summary: 登出（撤销当前 Token）
      tags:
        - auth
  /api/auth/me:
    get:
      operationId: auth-current-user
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
          description: Error
      summary: 当前用户信息
      tags:
        - auth
  /api/auth/password:
    put:
      operationId: auth-change-password
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
          description: Error
      summary: 修改密码
      tags:
        - auth
  /api/auth/refresh:
    post:
      operationId: auth-refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
          description: Error
      summary: 刷新登录凭证
      tags:
        - auth
  /api/v1/account/balance:
    get:
      operationId: account-balance
      parameters:
        - description: 1=租户 2=用户（管理员用）
          explode: false
          in: query
          name: accountType
          schema:
            description: 1=租户 2=用户（管理员用）
            format: int64
            type: integer
        - explode: false
          in: query
          name: accountId
          schema:
            type: string
        - explode: false
          in: query
          name: detail
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
          description: Error
      summary: 账户余额
      tags:
        - account
  /api/v1/account/recharge-records:
    get:
      operationId: account-recharge-records
      parameters:
        - explode: false
          in: query
          name: tenantId
          schema:
            type: string
        - explode: false
          in: query
          name: userId
          schema:
            type: string
        - explode: false
          in: query
          name: tenantName
          schema:
            type: string
        - explode: false
          in: query
          name: username
          schema:
            type: string
        - description: 1=平台充租户 2=租户充用户
          explode: false
          in: query
          name: rechargeType
          schema:
            description: 1=平台充租户 2=租户充用户
            type: string
        - explode: false
          in: query
          name: timeFrom
          schema:
            format: int64
            type: integer
        - explode: false
          in: query
          name: timeTo
          schema:
            format: int64
            type: integer
        - explode: false
          in: query
          name: page
          schema:
            default: 1
            format: int64
            type: integer
        - explode: false
          in: query
          name: size
          schema:
            default: 20
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageRechargeRecordRow"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
          description: Error
      summary: 充值记录
      tags:
        - account
  /api/v1/account/stats:
    get:
      operationId: account-stats
      parameters:
        - explode: false
          in: query
          name: accountId
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatsResult"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
          description: Error
      summary: 账户统计
      tags:
        - account
  /api/v1/account/transactions:
    get:
      operationId: account-transactions
      parameters:
        - explode: false
          in: query
          name: tenantId
          schema:
            type: string
        - explode: false
          in: query
          name: userId
          schema:
            type: string
        - explode: false
          in: query
          name: tenantName
          schema:
            type: string
        - explode: false
          in: query
          name: username
          schema:
            type: string
        - explode: false
          in: query
          name: clientName
          schema:
            type: string
        - explode: false
          in: query
          name: status
          schema:
            type: string
        - explode: false
          in: query
          name: timeFrom
          schema:
            format: int64
            type: integer
        - explode: false
          in: query
          name: timeTo
          schema:
            format: int64
            type: integer
        - explode: false
          in: query
          name: page
          schema:
            default: 1
            format: int64
            type: integer
        - explode: false
          in: query
          name: size
          schema:
            default: 20
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageEventRow"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
          description: Error
      summary: 额度明细（含服务扣款审计）
      tags:
        - account
  /api/v1/admin/announcements:
    get:
      operationId: admin-list-announcements
      parameters:
        - explode: false
          in: query
          name: status
          schema:
            enum:
              - draft
              - published
              - archived
            type: string
        - explode: false
          in: query
          name: search
          schema:
            maxLength: 200
            type: string
        - explode: false
          in: query
          name: page
          schema:
            default: 1
            format: int64
            type: integer
        - explode: false
          in: query
          name: size
          schema:
            default: 20
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageAnnouncementOutputItem"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
          description: Error
      summary: 公告管理列表
      tags:
        - admin-announcements
    post:
      operationId: admin-create-announcement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementDraftBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementOutputItem"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
          description: Error
      summary: 创建公告草稿
      tags:
        - admin-announcements
  /api/v1/admin/announcements/{id}:
    delete:
      operationId: admin-delete-announcement
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
          description: Error
      summary: 删除公告草稿
      tags:
        - admin-announcements
    get:
      operationId: admin-get-announcement
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementOutputItem"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
          description: Error
      summary: 公告管理详情
      tags:
        - admin-announcements
    put:
      operationId: admin-update-announcement
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementDraftBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementOutputItem"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AppError"
          description: Error
      summary: 更新公告草稿
      tags:
        - admin-announcements
