components:
  schemas:
    AccountBalanceLot:
      additionalProperties: false
      properties:
        balanceLotId:
          type: string
        expiresAt:
          format: date-time
          type: string
        remainingUsd:
          format: double
          type: number
        source:
          type: string
        totalUsd:
          format: double
          type: number
      required:
        - balanceLotId
        - totalUsd
        - remainingUsd
        - source
      type: object
    AccountDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AccountDTO.json
          format: uri
          readOnly: true
          type: string
        base_url:
          description: 上游基础 URL
          type: string
        concurrency_limit:
          description: 最大并发请求数；为空表示不限制
          format: int32
          type: integer
        created_at:
          description: 创建时间，Unix 毫秒
          format: int64
          type: integer
        default_provider_family:
          description: 默认上游家族
          type: string
        extra_headers:
          description: 附加请求头 JSON
        id:
          description: 上游账号 ID
          type: string
        invalid_at:
          description: 系统判定失效时间，Unix 毫秒
          format: int64
          type: integer
        invalid_reason:
          description: 系统判定失效的原因
          type: string
        name:
          description: 账号名称
          type: string
        price_book_id:
          description: 租户结算价格表 ID
          type: string
        status:
          description: 状态：active=可用，invalid=凭据失效，disabled=管理员停用
          enum:
            - active
            - invalid
            - disabled
          type: string
        tenant_access_mode:
          description: 租户访问范围
          enum:
            - public
            - restricted
          type: string
        tenant_display_name:
          description: 租户侧展示名称
          type: string
        tenant_multiplier:
          description: 默认租户扣费倍率
          format: double
          type: number
        updated_at:
          description: 更新时间，Unix 毫秒
          format: int64
          type: integer
      required:
        - id
        - name
        - tenant_display_name
        - tenant_access_mode
        - base_url
        - extra_headers
        - default_provider_family
        - status
      type: object
    AccountStatsResult:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AccountStatsResult.json
          format: uri
          readOnly: true
          type: string
        endUserCount:
          format: int64
          type: integer
        inviteCodeCount:
          format: int64
          type: integer
        userDeductionUsd:
          format: double
          type: number
      required:
        - endUserCount
        - inviteCodeCount
        - userDeductionUsd
      type: object
    AccountStatusRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AccountStatusRequest.json
          format: uri
          readOnly: true
          type: string
        status:
          description: 状态
          enum:
            - active
            - disabled
          type: string
      required:
        - status
      type: object
    AccountsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AccountsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/AccountDTO"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    AdminUserItem:
      additionalProperties: false
      properties:
        createdTime:
          format: int64
          type: integer
        email:
          type: string
        status:
          format: int64
          type: integer
        statusText:
          type: string
        userId:
          type: string
        username:
          type: string
      required:
        - userId
        - username
        - email
        - status
        - statusText
        - createdTime
      type: object
    AnnouncementDraftBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AnnouncementDraftBody.json
          format: uri
          readOnly: true
          type: string
        audiences:
          items:
            $ref: "#/components/schemas/AudienceSelectionInput"
          type:
            - array
            - "null"
        category:
          enum:
            - general
            - maintenance
            - upgrade
            - pricing
            - security
          type: string
        contentMarkdown:
          maxLength: 50000
          type: string
        displayMode:
          enum:
            - inbox
            - popup
          type: string
        endsAt:
          format: int64
          type: integer
        severity:
          enum:
            - info
            - important
            - critical
          type: string
        startsAt:
          format: int64
          type: integer
        title:
          maxLength: 200
          type: string
      required:
        - title
        - contentMarkdown
        - category
        - severity
        - displayMode
      type: object
    AnnouncementOutputItem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AnnouncementOutputItem.json
          format: uri
          readOnly: true
          type: string
        announcementId:
          type: string
        archivedAt:
          format: int64
          type: integer
        audienceSizeAtPublish:
          format: int64
          type: integer
        audiences:
          items:
            $ref: "#/components/schemas/AudienceRuleOutput"
          type:
            - array
            - "null"
        category:
          type: string
        contentMarkdown:
          type: string
        createdAt:
          format: int64
          type: integer
        createdBy:
          type: string
        displayMode:
          type: string
        endsAt:
          format: int64
          type: integer
        publishedAt:
          format: int64
          type: integer
        publisherTenantId:
          type: string
        publisherType:
          type: string
        readAt:
          format: int64
          type: integer
        severity:
          type: string
        startsAt:
          format: int64
          type: integer
        status:
          type: string
        title:
          type: string
        updatedAt:
          format: int64
          type: integer
        updatedBy:
          type: string
      required:
        - announcementId
        - publisherType
        - title
        - contentMarkdown
        - category
        - severity
        - displayMode
        - status
        - createdBy
        - updatedBy
        - createdAt
        - updatedAt
      type: object
    AnnouncementRecipientOutput:
      additionalProperties: false
      properties:
        email:
          type: string
        readAt:
          format: int64
          type: integer
        tenantId:
          type: string
        userId:
          type: string
        userType:
          format: int64
          type: integer
        username:
          type: string
      required:
        - userType
        - userId
        - username
      type: object
    AnnouncementStatsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AnnouncementStatsOutputBody.json
          format: uri
          readOnly: true
          type: string
        audienceSizeAtPublish:
          format: int64
          type: integer
        currentAudienceSize:
          format: int64
          type: integer
        readCount:
          format: int64
          type: integer
      required:
        - audienceSizeAtPublish
        - currentAudienceSize
        - readCount
      type: object
    ApiKeyCreatedOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApiKeyCreatedOutputBody.json
          format: uri
          readOnly: true
          type: string
        key:
          $ref: "#/components/schemas/ApiKeyDTO"
        plaintext_key:
          description: 新生成的 API key 明文；创建/轮换响应返回
          type: string
      required:
        - plaintext_key
        - key
      type: object
    ApiKeyDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApiKeyDTO.json
          format: uri
          readOnly: true
          type: string
        created_at:
          description: 创建时间，Unix 毫秒
          format: int64
          type: integer
        created_by:
          description: 创建人
          type: string
        expires_at:
          description: 过期时间，Unix 毫秒
          format: int64
          type: integer
        group_id:
          description: 密钥唯一绑定的分组 ID
          type: string
        id:
          description: API key ID
          type: string
        last_four:
          description: API key 后四位，仅用于展示
          type: string
        last_used_at:
          description: 最后使用时间，Unix 毫秒
          format: int64
          type: integer
        limit_policy:
          $ref: "#/components/schemas/RuntimeLimitPolicyDTO"
          description: API key 独立限流策略
        name:
          description: 名称
          type: string
        owner_type:
          description: 归属主体类型
          enum:
            - tenant
            - user
          type: string
        quota_limit_micro_usd:
          description: 额度上限，单位 micro-USD；为空表示无限制
          format: int64
          type: integer
        quota_used_micro_usd:
          description: 已使用额度，单位 micro-USD
          format: int64
          type: integer
        status:
          description: 状态
          enum:
            - active
            - disabled
          type: string
        tenant_id:
          description: 租户 ID
          type: string
        updated_at:
          description: 更新时间，Unix 毫秒
          format: int64
          type: integer
        user_id:
          description: 用户 ID；租户 key 为空
          type: string
      required:
        - id
        - owner_type
        - tenant_id
        - group_id
        - name
        - quota_used_micro_usd
        - status
      type: object
    ApiKeyRevealOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApiKeyRevealOutputBody.json
          format: uri
          readOnly: true
          type: string
        plaintext_key:
          description: 当前 API key 的完整明文
          type: string
      required:
        - plaintext_key
      type: object
    ApiKeyStatusRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApiKeyStatusRequest.json
          format: uri
          readOnly: true
          type: string
        status:
          description: 状态
          enum:
            - active
            - disabled
          type: string
      required:
        - status
      type: object
    ApiKeyWriteRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApiKeyWriteRequest.json
          format: uri
          readOnly: true
          type: string
        created_by:
          description: 创建人；仅创建时使用
          type: string
        expires_at:
          description: 过期时间，Unix 毫秒；为空表示不过期
          format: int64
          type: integer
        group_id:
          description: 密钥唯一绑定的分组 ID
          type: string
        limit_policy:
          $ref: "#/components/schemas/ScopedLimitPolicyWriteRequest"
          description: API key 独立限流策略
        name:
          description: 名称
          type: string
        quota_limit_micro_usd:
          description: 额度上限，单位 micro-USD；为空表示无限制
          format: int64
          minimum: 0
          type: integer
        status:
          description: 状态；为空默认 active
          enum:
            - active
            - disabled
          type: string
      required:
        - name
        - group_id
      type: object
    ApiKeysOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApiKeysOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/ApiKeyDTO"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    AppError:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AppError.json
          format: uri
          readOnly: true
          type: string
        code:
          type: string
        detail:
          type: string
        errors:
          items:
            $ref: "#/components/schemas/FieldError"
          type:
            - array
            - "null"
        meta:
          additionalProperties: {}
          type: object
        status:
          format: int64
          type: integer
        title:
          type: string
      required:
        - status
        - title
      type: object
    AsyncTaskChatCompletionInput:
      additionalProperties: true
      description: 与 POST /v1/chat/completions 请求体同构；stream 固定为 false。
      properties:
        messages:
          items:
            additionalProperties: true
            type: object
          type: array
        model:
          description: 模型代码
          type: string
        stream:
          default: false
          type: boolean
      required:
        - model
        - messages
      type: object
    AsyncTaskCreateJSONRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AsyncTaskCreateJSONRequest.json
          format: uri
          readOnly: true
          type: string
        input:
          $ref: "#/components/schemas/AsyncTaskInput"
          description: 与对应同步 API 请求体逐字段同构；chat 强制非流式
        metadata:
          additionalProperties: {}
          description: 调用方业务元数据；不参与执行与幂等指纹，创建和查询响应会原样回显
          type: object
        type:
          description: 任务能力类型
          enum:
            - images.generation
            - images.edit
            - chat.completions
          type: string
        webhook_url:
          description: 可选终态通知地址；必须是解析到公网地址的绝对 HTTPS URL
          format: uri
          type: string
      required:
        - type
        - input
      type: object
    AsyncTaskCreateMultipartRequest:
      additionalProperties: false
      description: 异步图生图 multipart 信封；其余字段与 POST /v1/images/edits 相同。
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AsyncTaskCreateMultipartRequest.json
          format: uri
          readOnly: true
          type: string
        background:
          type: string
        image[]:
          contentMediaType: application/octet-stream
          format: binary
          type: string
        input_fidelity:
          type: string
        mask:
          contentMediaType: application/octet-stream
          format: binary
          type: string
        metadata:
          description: JSON 对象字符串
          type: string
        model:
          type: string
        "n":
          maximum: 10
          minimum: 1
          type: integer
        output_compression:
          type: integer
        output_format:
          type: string
        prompt:
          type: string
        response_format:
          type: string
        size:
          type: string
        stream:
          default: false
          type: boolean
        type:
          enum:
            - images.edit
          type: string
        user:
          type: string
        webhook_url:
          format: uri
          type: string
      required:
        - type
        - model
        - image[]
      type: object
    AsyncTaskCreateResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AsyncTaskCreateResponse.json
          format: uri
          readOnly: true
          type: string
        created_at:
          description: Unix 时间戳（秒）
          format: int64
          type: integer
        id:
          format: uuid
          type: string
        idempotency_key:
          type: string
        metadata:
          additionalProperties: {}
          type: object
        model:
          type: string
        object:
          enum:
            - task
          type: string
        status:
          enum:
            - pending
            - running
            - completed
            - failed
            - cancelled
          type: string
        type:
          enum:
            - images.generation
            - images.edit
            - chat.completions
          type: string
        webhook_url:
          format: uri
          type: string
      required:
        - id
        - object
        - type
        - status
        - model
        - idempotency_key
        - metadata
        - created_at
      type: object
    AsyncTaskError:
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
      type: object
    AsyncTaskGetResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AsyncTaskGetResponse.json
          format: uri
          readOnly: true
          type: string
        attempt:
          format: int64
          type: integer
        completed_at:
          description: Unix 时间戳（秒）
          format: int64
          type:
            - integer
            - "null"
        created_at:
          description: Unix 时间戳（秒）
          format: int64
          type: integer
        error:
          $ref: "#/components/schemas/AsyncTaskError"
        id:
          format: uuid
          type: string
        idempotency_key:
          type: string
        metadata:
          additionalProperties: {}
          type: object
        model:
          type: string
        object:
          enum:
            - task
          type: string
        request_id:
          type: string
        result:
          additionalProperties: {}
          type: object
        started_at:
          description: Unix 时间戳（秒）
          format: int64
          type:
            - integer
            - "null"
        status:
          enum:
            - pending
            - running
            - completed
            - failed
            - cancelled
          type: string
        type:
          enum:
            - images.generation
            - images.edit
            - chat.completions
          type: string
        usage:
          $ref: "#/components/schemas/AsyncTaskUsage"
        webhook_url:
          format: uri
          type: string
      required:
        - result
        - error
        - usage
        - request_id
        - attempt
        - started_at
        - completed_at
        - id
        - object
        - type
        - status
        - model
        - idempotency_key
        - metadata
        - created_at
      type: object
    AsyncTaskImageEditInput:
      additionalProperties: false
      description: 图生图 JSON 请求；也可使用 multipart/form-data 上传 image[] 文件。
      properties:
        background:
          type: string
        images:
          items:
            properties:
              image_url:
                description: HTTP(S) URL 或 data:image/...;base64,...
                type: string
            required:
              - image_url
            type: object
          maxItems: 16
          minItems: 1
          type: array
        input_fidelity:
          type: string
        mask:
          properties:
            image_url:
              description: HTTP(S) URL 或 data:image/...;base64,...
              type: string
          required:
            - image_url
          type: object
        model:
          type: string
        "n":
          maximum: 10
          minimum: 1
          type: integer
        output_compression:
          type: integer
        output_format:
          type: string
        prompt:
          type: string
        response_format:
          enum:
            - b64_json
            - url
          type: string
        size:
          type: string
        stream:
          default: false
          type: boolean
        user:
          type: string
      required:
        - model
        - images
      type: object
    AsyncTaskImageGenerationInput:
      additionalProperties: false
      properties:
        background:
          type: string
        model:
          description: 模型代码
          type: string
        "n":
          format: int64
          maximum: 10
          minimum: 1
          type: integer
        output_compression:
          format: int64
          type: integer
        output_format:
          type: string
        prompt:
          description: 图片生成提示词
          type: string
        response_format:
          enum:
            - b64_json
            - url
          type: string
        size:
          type: string
        stream:
          default: false
          type: boolean
        user:
          type: string
      required:
        - model
        - prompt
      type: object
    AsyncTaskInput:
      additionalProperties: false
      description: 输入与对应同步 API 同构；chat.completions 强制 stream=false。
      oneOf:
        - $ref: "#/components/schemas/AsyncTaskImageGenerationInput"
        - $ref: "#/components/schemas/AsyncTaskImageEditInput"
        - $ref: "#/components/schemas/AsyncTaskChatCompletionInput"
      type: object
    AsyncTaskListResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AsyncTaskListResponse.json
          format: uri
          readOnly: true
          type: string
        data:
          items:
            $ref: "#/components/schemas/AsyncTaskGetResponse"
          type:
            - array
            - "null"
        has_more:
          type: boolean
        object:
          enum:
            - list
          type: string
      required:
        - object
        - data
        - has_more
      type: object
    AsyncTaskUsage:
      additionalProperties: false
      properties:
        cost_usd:
          description: 任务调用方的已结算消耗USD 金额
          format: double
          type: number
      required:
        - cost_usd
      type: object
    AudienceRuleOutput:
      additionalProperties: false
      properties:
        kind:
          type: string
        scope:
          type: string
        tenantId:
          type: string
      required:
        - kind
        - scope
      type: object
    AudienceSelectionInput:
      additionalProperties: false
      properties:
        kind:
          enum:
            - admin
            - tenant_user
            - end_user
          type: string
        scope:
          enum:
            - all
            - tenant
          type: string
        tenantIds:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - kind
        - scope
      type: object
    AuditLogDTO:
      additionalProperties: false
      properties:
        action:
          description: 动作
          type: string
        actor:
          description: 操作者
          type: string
        created_at:
          description: 创建时间，Unix 毫秒
          format: int64
          type: integer
        http_status:
          description: HTTP 状态码
          format: int32
          type: integer
        id:
          description: 审计日志 ID
          type: string
        object_id:
          description: 对象 ID
          type: string
        object_type:
          description: 对象类型
          type: string
        request_summary:
          description: 请求摘要 JSON
        result:
          description: 结果
          type: string
      required:
        - id
        - action
        - request_summary
        - result
      type: object
    AuditLogItem:
      additionalProperties: false
      properties:
        createdAt:
          format: int64
          type: integer
        decision:
          type: string
        eventType:
          type: string
        id:
          format: int64
          type: integer
        principalType:
          type: string
        reasonCode:
          type: string
        reasonMessage:
          type: string
        userId:
          type: string
      required:
        - id
        - eventType
        - principalType
        - decision
        - createdAt
      type: object
    AuditLogsOutputBody:
      additionalProperties: false
      properties:
        $schema:
