# =============================================================
# Uni AI API nginx 业务配置
# 部署位置：/etc/nginx/conf.d/uni-ai.conf
#
# 域名规划：
#   ai.admin.ainm.store  → AI 管理端前端
#   ai.tenant.ainm.store → AI 租户端前端
#   ai.ainm.store        → AI 用户端前端
#
# 后端：
#   ai-service:13010     → Uni AI API 后端服务
#
# 说明：
#   - /api/*、/admin/* 是控制台管理接口
#   - /console/* 是 JWT 网页运行时接口，支持 SSE/流式响应
#   - /v1/*、/v1beta/* 是 API Key 运行时接口，兼容 OpenAI / Anthropic / Gemini 风格
#   - /urm/v1/*、/urm/oauth2/* 代理到 URM 后端 /api/*，供 URM 共享页面复用当前宿主登录态调用
#   - 其他 /urm/* 是 URM 共享页面前端路由，回退到当前业务前端 index.html
# =============================================================

upstream uni_ai_api_backend {
    server ai-service:13010;
    keepalive 64;
}

upstream urm_backend {
    server urm-service:6900;
    keepalive 32;
}

# ── HTTP → HTTPS 重定向 ────────────────────────────────────────────
server {
    listen 80;
    server_name ai.admin.ainm.store ai.tenant.ainm.store ai.ainm.store;
    return 301 https://$host$request_uri;
}

# =============================================================
# 公共片段说明
# nginx 不支持在 conf.d 内定义普通 location macro，这里三个 server
# 保持显式配置，方便按端差异调整 root/client_max_body_size。
# =============================================================

# ── 管理端：ai.admin.ainm.store ──────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name ai.admin.ainm.store;

    ssl_certificate     /etc/nginx/ssl/ainm.crt;
    ssl_certificate_key /etc/nginx/ssl/ainm.key;

    add_header Strict-Transport-Security "max-age=63072000" always;

    root  /opt/html/ai-admin;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass         http://uni_ai_api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout   120s;
    }

    location /admin/ {
        proxy_pass         http://uni_ai_api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout   120s;
    }

    location /v1/ {
        proxy_pass         http://uni_ai_api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        client_max_body_size 20m;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }

    location /v1beta/ {
        proxy_pass         http://uni_ai_api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        client_max_body_size 20m;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }

    location /urm/v1/ {
        rewrite ^/urm/(.*)$ /api/$1 break;
        proxy_pass         http://urm_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout   120s;
    }

    location /urm/oauth2/ {
        rewrite ^/urm/(.*)$ /api/$1 break;
        proxy_pass         http://urm_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout   120s;
    }

    location /urm/ {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}

