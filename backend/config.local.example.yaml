app:
  env: development
  httpAddr: ":13010"
  logLevel: info

postgres:
  dsn: "postgres://postgres:postgres@127.0.0.1:5432/uni_ai_api?sslmode=disable&search_path=public"
  maxConns: 10
  minConns: 1
  maxConnLifetime: 1h

redis:
  enabled: true
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

urm:
  baseUrl: "http://127.0.0.1:6900"
  appKey: "UNI_AI_API_LOCAL"
  appSecret: "change-me-local-urm-secret"
  timeout: 10s

security:
  providerKeyMaster: "change-me-local-provider-key-master"
  adminToken: "local-admin-token"
